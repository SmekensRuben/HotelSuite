name: Verify & Deploy to GoDaddy

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install frontend and tooling dependencies
        run: npm ci

      - name: Install Functions dependencies
        run: npm --prefix functions ci

      - name: Frontend tests
        run: npm test -- --run

      - name: Functions tests
        run: npm --prefix functions test

      - name: Firestore and Storage security tests
        run: npm run test:security

      - name: Emulator backup and restore smoke test
        run: npm run test:restore

      - name: Dependency policy
        run: npm run audit:policy

      - name: Build
        env:
          VITE_DEPLOYMENT_ENV: production
          VITE_AUTH_REQUIRE_MFA: ${{ vars.PROD_AUTH_REQUIRE_MFA }}
          VITE_FIREBASE_API_KEY: ${{ secrets.PROD_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.PROD_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.PROD_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.PROD_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.PROD_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.PROD_FIREBASE_APP_ID }}
          VITE_MEILI_HOST: ${{ secrets.PROD_MEILI_HOST }}
          VITE_MEILI_SEARCH_KEY: ${{ secrets.PROD_MEILI_SEARCH_KEY }}
          EXPECTED_FIREBASE_PROJECT_ID: ${{ secrets.PROD_FIREBASE_PROJECT_ID }}
          PRODUCTION_FIREBASE_PROJECT_ID: ${{ secrets.PROD_FIREBASE_PROJECT_ID }}
        run: npm run build

      - name: Deploy via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.SERVER_HOST }}        # bv. IP of geldige host
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASS }}
          port: ${{ secrets.SERVER_PORT }}          # 21
          protocol: ftps                            # evt. tijdelijk 'ftp' om te testen
          local-dir: ./dist/                        # of ./build/
          server-dir: ${{ secrets.SERVER_DIR }}     # bv. public_html/emmelydeprijck.be/
          log-level: minimal

          # Belangrijk: verwijder oude hashed JS/CSS
          dangerous-clean-slate: false
