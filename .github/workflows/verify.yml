name: Verify HotelSuite

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install frontend and tooling dependencies
        run: npm ci

      - name: Install Functions dependencies
        run: npm --prefix functions ci

      - name: Frontend tests
        run: npm test -- --run

      - name: Functions tests
        run: npm --prefix functions test

      - name: Validate Functions deployment scripts
        run: |
          bash -n scripts/firebase/setup-functions-deployment.sh scripts/firebase/check-functions-runtime.sh scripts/firebase/rollout-saas-pilot.sh scripts/firebase/rollout-private-workflows.sh
          node --check scripts/firebase/check-functions-release.mjs
          node --check scripts/firebase/saas-rollout.mjs
          node --check scripts/firebase/saas-release-check.mjs
          node --check scripts/firebase/private-workflows-rollout.mjs
          node --check scripts/firebase/private-workflows-migration.mjs

      - name: Firestore and Storage security tests
        run: npm run test:security

      - name: Emulator backup and restore smoke test
        run: npm run test:restore

      - name: Dependency policy
        run: npm run audit:policy

      - name: Build with non-production fixture
        run: npm run build:test

      - name: Build App Hosting with non-production fixture
        env:
          NODE_ENV: test
          VITE_DEPLOYMENT_ENV: test
          VITE_AUTH_REQUIRE_MFA: "false"
          EXPECTED_FIREBASE_PROJECT_ID: demo-hotel-suite-a00
          FIREBASE_WEBAPP_CONFIG: >-
            {"apiKey":"fictional-apphosting-key","authDomain":"demo-hotel-suite-a00.firebaseapp.com","projectId":"demo-hotel-suite-a00","storageBucket":"demo-hotel-suite-a00.appspot.com","messagingSenderId":"000000000000","appId":"fictional-apphosting-app"}
        run: npm run build:apphosting
